services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: radarnaque
      POSTGRES_PASSWORD: radarnaque
      POSTGRES_DB: radarnaque
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP (-h 127.0.0.1) : pas « sain » pendant l'init de l'entrypoint, qui n'écoute que sur le socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U radarnaque -d radarnaque"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Origine unique http://localhost:8080 : /auth/* → auth (hôte:3000), /api/* → api
  # (hôte:8000), le reste → apps/site/dist. Voir Caddyfile.dev.
  caddy:
    image: caddy:2
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ../apps/site/dist:/srv/site:ro

  # Moteur de recherche web de l'API (outil web_search), joint sur http://127.0.0.1:8888
  # (SEARXNG_URL par défaut de l'API). Configuration : searxng/settings.yml. Le secret ne sert
  # qu'à l'instance locale : `openssl rand -hex 32` dans infra/.env (SEARXNG_SECRET) pour en changer.
  searxng:
    image: searxng/searxng:2026.10.4-d48c4b555
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-dev-only-searxng-secret-not-for-production}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
