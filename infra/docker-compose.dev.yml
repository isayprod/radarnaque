services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: radarnaque
      POSTGRES_PASSWORD: radarnaque
      POSTGRES_DB: radarnaque
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radarnaque -d radarnaque"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
