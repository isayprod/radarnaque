<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Classe js posée avant le rendu (apparitions sans éclair), seulement si les modules sont pris en charge (un navigateur trop ancien pour les fonctions fléchées n'exécute rien) ; retirée au bout de 3 s si main.ts n'a pas posé js-ready (script absent, bloqué ou en échec) : la page redevient celle sans JavaScript, et data-js-late indique à main.ts, s'il arrive plus tard, de ne rien recacher. -->
		<script>(() => { if (!("noModule" in HTMLScriptElement.prototype)) return; const r = document.documentElement; r.classList.add("js"); setTimeout(() => { if (r.classList.contains("js-ready")) return; r.classList.remove("js"); r.setAttribute("data-js-late", ""); }, 3000); })();</script>
		<!--landing:head-->
		<link rel="stylesheet" href="/src/landing/landing.css" />
	</head>
	<body class="landing">
		<!--landing:body-->
		<script type="module" src="/src/landing/main.ts"></script>
	</body>
</html>
